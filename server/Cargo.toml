[package]
name = "codex-reach-server"
version = "0.5.1"
edition = "2024"
rust-version = "1.96"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
axum = "0.8.9"
json-patch = "5.0.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal", "process"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
uuid = { version = "1.29.2", features = ["v4"] }
