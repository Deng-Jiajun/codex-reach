name: Android verification

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upgrade_run_id:
        description: Successful fixed-signature run to install before testing the update
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  windows-service:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Prepare Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt
      - name: Check and build Windows service
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo +1.96.0 fmt --manifest-path server/Cargo.toml --check
          cargo +1.96.0 test --manifest-path server/Cargo.toml --locked
          cargo +1.96.0 build --manifest-path server/Cargo.toml --release --locked
          npm ci --no-fund
          npm test
          npm run build
          New-Item -ItemType Directory -Path artifacts/windows -Force
          Copy-Item server/target/release/codex-reach-server.exe artifacts/windows/
          Copy-Item dist artifacts/windows/web -Recurse
          Copy-Item README.md artifacts/windows/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: codex-reach-windows-${{ github.run_number }}
          path: artifacts/windows/
          if-no-files-found: error
          retention-days: 14
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build web assets and synchronize Android
        run: |
          npm ci --no-fund
          npm test
          npm run android:sync
      - name: Build APK and instrumentation tests
        working-directory: android
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          REACH_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          REACH_SIGNING_STORE_FILE: ${{ runner.temp }}/codex-reach.p12
        run: |
          test -n "$ANDROID_SIGNING_KEYSTORE" && test -n "$REACH_SIGNING_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_SIGNING_KEYSTORE" | base64 --decode > "$REACH_SIGNING_STORE_FILE"
          ./gradlew --no-daemon clean :app:assembleDebug :app:assembleDebugAndroidTest
          ./gradlew --no-daemon :app:dependencyInsight --dependency sqlite --configuration debugRuntimeClasspath
      - name: Check APK signing and 16 KB packaging
        run: |
          mkdir -p artifacts
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee artifacts/signing.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 android/app/build/outputs/apk/debug/app-debug.apk > artifacts/zip-alignment.txt
          python3 scripts/check-elf-alignment.py android/app/build/outputs/apk/debug/app-debug.apk | tee artifacts/elf-alignment.txt
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee artifacts/apk-sha256.txt
      - name: Download the previous fixed-signature APK
        if: inputs.upgrade_run_id != ''
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: codex-reach-verification-*
          run-id: ${{ inputs.upgrade_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/previous-build
          merge-multiple: true
      - name: Compare update signing certificates
        if: inputs.upgrade_run_id != ''
        run: |
          previous="$RUNNER_TEMP/previous-build/android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$previous" > artifacts/previous-signing.txt
          diff <(grep 'certificate SHA-256 digest:' artifacts/previous-signing.txt) <(grep 'certificate SHA-256 digest:' artifacts/signing.txt)
      - name: Enable emulator hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Verify SQLite through the Capacitor bridge on Android 16
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        env:
          UPGRADE_APK: ${{ inputs.upgrade_run_id != '' && format('{0}/previous-build/android/app/build/outputs/apk/debug/app-debug.apk', runner.temp) || '' }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: >-
            bash -euo pipefail -c '
            bash scripts/android-smoke.sh;
            python3 scripts/chat-fixture.py > artifacts/organization-fixture.txt 2>&1 & organization_fixture_pid=$!;
            trap "kill $organization_fixture_pid; adb logcat -d > artifacts/organization-logcat.txt || true" EXIT;
            for stage in organization organization-persist; do
            adb shell am force-stop io.github.dengjiajun.codexreach.verification;
            adb shell am instrument -w -r -e class io.github.dengjiajun.codexreach.OrganizationFlowTest
            -e stage "$stage" io.github.dengjiajun.codexreach.verification.test/androidx.test.runner.AndroidJUnitRunner
            | tee "artifacts/instrumentation-$stage.txt";
            grep -q "OK (1 test)" "artifacts/instrumentation-$stage.txt";
            adb pull "/sdcard/Android/data/io.github.dengjiajun.codexreach.verification/files/verification-$stage.png" artifacts/;
            done;
            curl --fail --silent http://127.0.0.1:4320/control/organization-stats > artifacts/organization-stats.json
            '
      - name: Upload APK and verification results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: codex-reach-verification-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            artifacts/
          if-no-files-found: error
          retention-days: 14
