<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Codex Reach</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="app-heading">
          <button id="cancel-settings" class="quiet icon-button" type="button" aria-label="返回" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
          <span id="brand" class="brand">Codex Reach</span>
        </div>
        <div class="header-actions">
          <span class="connection-state" data-connection-status role="status"></span>
          <button id="settings-button" class="quiet icon-button" type="button" aria-label="连接设置"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.6 2a8 8 0 0 0-1.5.9L5.3 5.4 3 9.4l1.5 1.5a8 8 0 0 0 0 2.2L3 14.6l2.3 4 2.1-.5a8 8 0 0 0 1.5.9l.6 2h5l.6-2a8 8 0 0 0 1.5-.9l2.1.5 2.3-4-1.5-1.5a8 8 0 0 0 0-2.2L21 9.4l-2.3-4-2.1.5a8 8 0 0 0-1.5-.9L14.5 3Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </header>
      <p id="notice" role="status" aria-live="polite" hidden></p>
      <div id="reconnect-notice" role="status" aria-live="polite" hidden>
        <span id="reconnect-text"></span>
        <button id="reconnect-button" class="quiet" type="button">立即重连</button>
      </div>
      <main id="connection-view" class="connection-view">
        <section class="connection-card">
          <p>打开电脑上的 Codex Reach 服务，手机连接同一 Tailscale 网络。</p>
          <form id="connection-form">
            <label for="server-url">服务地址</label>
            <input id="server-url" type="url" placeholder="http://100.x.x.x:4317" required autocapitalize="none" spellcheck="false" />
            <label for="server-key">访问密钥</label>
            <input id="server-key" type="password" required autocomplete="current-password" />
            <button id="connect-button" class="primary" type="submit" disabled>连接</button>
          </form>
          <p class="connection-help">在电脑上打开服务的 /setup 页面，可查看连接信息。</p>
          <a class="diagnostic-link" href="/verification.html">SQLite 检查</a>
        </section>
      </main>
      <main id="inbox-view" class="inbox-view" hidden>
        <div class="inbox-heading">
          <h1>对话</h1>
          <div class="refresh-controls">
            <span id="refresh-status" class="sr-only" role="status" aria-live="polite"></span>
            <button id="refresh-button" class="quiet icon-button" type="button" aria-label="刷新"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 6.1A8.3 8.3 0 0 1 20 12M4 12a8.3 8.3 0 0 0 13.9 5.9"/></svg></button>
          </div>
        </div>
        <div class="filters">
          <label class="sr-only" for="project-filter">项目</label>
          <select id="project-filter"><option value="">全部项目</option></select>
          <label class="sr-only" for="thread-search">搜索已加载的对话</label>
          <input id="thread-search" type="search" placeholder="搜索对话" />
        </div>
        <div id="thread-list" class="thread-list"></div>
        <button id="more-threads" class="quiet more" type="button" hidden>加载更多对话</button>
      </main>
      <main id="chat-view" class="chat-view" hidden>
        <header class="chat-header">
          <button id="back-button" class="quiet icon-button" type="button" aria-label="返回对话列表"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
          <div class="chat-heading">
            <h1 id="chat-title"></h1>
            <div class="chat-metadata"><p id="chat-meta"></p><span id="chat-state" class="state"></span></div>
          </div>
          <div class="header-actions">
            <span class="connection-state" data-connection-status role="status"></span>
            <button id="chat-settings-button" class="quiet icon-button" type="button" aria-label="连接设置"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.6 2a8 8 0 0 0-1.5.9L5.3 5.4 3 9.4l1.5 1.5a8 8 0 0 0 0 2.2L3 14.6l2.3 4 2.1-.5a8 8 0 0 0 1.5.9l.6 2h5l.6-2a8 8 0 0 0 1.5-.9l2.1.5 2.3-4-1.5-1.5a8 8 0 0 0 0-2.2L21 9.4l-2.3-4-2.1.5a8 8 0 0 0-1.5-.9L14.5 3Z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </header>
        <div id="chat-error" role="status" hidden>
          <span id="chat-error-text"></span>
          <button id="retry-history" class="quiet" type="button">重试</button>
        </div>
        <div id="messages-scroll" class="messages-scroll">
          <button id="older-button" class="quiet more" type="button" hidden>读取更早的消息</button>
          <div id="messages"></div>
          <p id="activity" class="activity" role="status" hidden></p>
        </div>
        <div class="composer-area">
          <div id="delivery-note" class="delivery-note" hidden>
            <p id="delivery-text"></p>
            <button id="resolve-delivery" class="quiet" type="button" hidden>已核对，恢复编辑</button>
          </div>
          <form id="message-form" class="composer">
            <label class="sr-only" for="message-input">消息</label>
            <textarea id="message-input" rows="2" placeholder="发送消息" spellcheck="false"></textarea>
            <button id="send-button" class="send" type="submit">发送</button>
          </form>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
