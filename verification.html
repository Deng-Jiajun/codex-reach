<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Codex Reach</title>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Android 技术验证</p>
        <h1>Codex Reach</h1>
        <p id="platform"></p>
      </header>
      <section aria-labelledby="verification-heading">
        <h2 id="verification-heading">SQLite 检查</h2>
        <p>使用合成聊天数据，检查原生数据库和应用重启后的数据保留。</p>
        <div class="actions">
          <button id="run" type="button">运行全部检查</button>
          <button id="persist" class="secondary" type="button">检查已保存数据</button>
        </div>
        <p id="status" role="status" aria-live="polite">准备就绪</p>
        <ol id="results"></ol>
        <p id="summary"></p>
      </section>
      <footer>首次运行全部检查后，关闭并重新打开应用，再检查已保存数据。</footer>
    </main>
    <script type="module" src="/src/verification.ts"></script>
  </body>
</html>
